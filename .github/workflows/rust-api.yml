name: Rust and native regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pin third-party actions to immutable commit SHAs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --locked

      - name: Native C++ protocol and launcher unit tests
        run: |
          cmake -S . -B build/ci-native -DWORKER_ARCH=x86_64
          cmake --build build/ci-native --target common_tests worker-launch --parallel 2
          ctest --test-dir build/ci-native --output-on-failure

      - name: Linux worker namespace and lifecycle tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror native/launcher.cpp -o /tmp/worker-launch
          sudo python3 tests/launcher_namespace.py /tmp/worker-launch -v

      - name: Build HTTP server for integration tests
        run: cargo build --locked

      - name: Synthetic HTTP worker and APK staging tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
